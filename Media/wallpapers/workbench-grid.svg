  <!-- Fine grid — 32px cells -->
  <rect x="32" y="0" width="0.6" height="128" fill="#142840" opacity="0.7"/>
  <rect x="64" y="0" width="0.6" height="128" fill="#142840" opacity="0.7"/>
  <rect x="96" y="0" width="0.6" height="128" fill="#142840" opacity="0.7"/>
