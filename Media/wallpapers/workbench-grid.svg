  <rect x="0" y="54" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="58" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="62" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="66" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="70" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="74" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="78" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="82" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="86" width="128" height="1" fill="#080e18" opacity="0.55"/>
