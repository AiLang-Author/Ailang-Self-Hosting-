  <rect x="0" y="102" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="106" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="110" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="114" width="128" height="1" fill="#080e18" opacity="0.55"/>
