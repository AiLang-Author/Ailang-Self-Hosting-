  <rect x="0" y="64" width="128" height="0.6" fill="#142840" opacity="0.7"/>
  <rect x="0" y="96" width="128" height="0.6" fill="#142840" opacity="0.7"/>

  <!-- Major tile border — matches on wrap for seamless tiling -->
  <rect x="0" y="0" width="128" height="0.8" fill="#2a4068" opacity="0.85"/>
  <rect x="0" y="127.2" width="128" height="0.8" fill="#2a4068" opacity="0.85"/>
  <rect x="0" y="0" width="0.8" height="128" fill="#2a4068" opacity="0.85"/>
  <rect x="127.2" y="0" width="0.8" height="128" fill="#2a4068" opacity="0.85"/>

  <!-- Subtle cyan HUD corner ticks -->
  <rect x="4" y="4" width="10" height="0.6" fill="#2ad4ff" opacity="0.25"/>
