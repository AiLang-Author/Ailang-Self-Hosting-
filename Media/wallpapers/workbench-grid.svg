<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Workbench Reborn desktop substrate — seamless 128×128 tile, 32px grid -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1428"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
  </defs>

  <!-- Abyss base -->
  <rect x="0" y="0" width="128" height="128" fill="url(#bg)"/>

  <!-- Faint scanlines -->
  <rect x="0" y="2" width="128" height="1" fill="#080e18" opacity="0.55"/>
  <rect x="0" y="6" width="128" height="1" fill="#080e18" opacity="0.55"/>
