<window title="Calculator" design-w="280" design-h="380" toolbar="about">
  <group layout="vbox" gap="4" padding="8" bg="#1C1C2E">
    <panel height="56" bg="#0D1117" padding="8">
      <label text="0" fg="#00FF88" text-align="right" height="40" font-size="24" id="display"/>
    </panel>
    <group layout="hbox" gap="4">
      <button label="C"   action="c.clr" grow="1" height="52" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="+/-" action="c.neg" grow="1" height="52" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="%"   action="c.pct" grow="1" height="52" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="/"   action="c.div" grow="1" height="52" bg="#FF9500" fg="#FFFFFF"/>
    </group>
    <group layout="hbox" gap="4">
      <button label="7" action="c.7" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="8" action="c.8" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="9" action="c.9" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="x" action="c.mul" grow="1" height="52" bg="#FF9500" fg="#FFFFFF"/>
    </group>
    <group layout="hbox" gap="4">
      <button label="4" action="c.4" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="5" action="c.5" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="6" action="c.6" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="-" action="c.sub" grow="1" height="52" bg="#FF9500" fg="#FFFFFF"/>
    </group>
    <group layout="hbox" gap="4">
      <button label="1" action="c.1" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="2" action="c.2" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="3" action="c.3" grow="1" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="+" action="c.add" grow="1" height="52" bg="#FF9500" fg="#FFFFFF"/>
    </group>
    <group layout="hbox" gap="4">
      <button label="0"   action="c.0"  grow="2" height="52" bg="#2A2A3C" fg="#E0E0E0"/>
      <button label="="   action="c.eq" grow="1" height="52" bg="#00CC66" fg="#FFFFFF"/>
      <button label="DEL" action="c.bk" grow="1" height="52" bg="#3D3D50" fg="#E0E0E0"/>
    </group>
  </group>
</window>
