<window title="Untitled - Document" design-w="720" design-h="520" toolbar="file">
  <group layout="vbox" gap="0" padding="0">
    <group layout="vbox" gap="2" padding="3" bg="#1A2740" height="58" min-h="58" max-h="58" shrink="0">
      <group layout="hbox" gap="3" padding="0" height="24" shrink="0">
        <label text="Times" width="56" height="22" fg="#E8EEF8"/>
        <input id="sz" value="12" width="40" height="22" action="fmt.size"/>
        <button label="B" width="24" height="22" icon="fmt_bold" action="fmt.bold" bg="#2A4068" fg="#E8EEF8"/>
        <button label="I" width="24" height="22" icon="fmt_italic" action="fmt.italic" bg="#2A4068" fg="#E8EEF8"/>
        <button label="U" width="24" height="22" icon="fmt_underline" action="fmt.underline" bg="#2A4068" fg="#E8EEF8"/>
        <label text="" width="8" height="22"/>
        <button width="24" height="22" icon="fmt_align_left" action="fmt.align.left" bg="#2A4068" fg="#E8EEF8"/>
        <button width="24" height="22" icon="fmt_align_center" action="fmt.align.center" bg="#2A4068" fg="#E8EEF8"/>
        <button width="24" height="22" icon="fmt_align_right" action="fmt.align.right" bg="#2A4068" fg="#E8EEF8"/>
        <button width="24" height="22" icon="fmt_align_just" action="fmt.align.just" bg="#2A4068" fg="#E8EEF8"/>
      </group>
      <group layout="hbox" gap="3" padding="0" height="24" shrink="0">
        <label text="L" width="12" height="22" fg="#E8EEF8"/>
        <input id="ml" value="1.00" width="48" height="22" action="fmt.margin"/>
        <label text="T" width="12" height="22" fg="#E8EEF8"/>
        <input id="mt" value="1.00" width="48" height="22" action="fmt.margin"/>
        <label text="R" width="12" height="22" fg="#E8EEF8"/>
        <input id="mr" value="1.00" width="48" height="22" action="fmt.margin"/>
        <label text="B" width="12" height="22" fg="#E8EEF8"/>
        <input id="mb" value="1.00" width="48" height="22" action="fmt.margin"/>
        <label text="H" width="12" height="22" fg="#E8EEF8"/>
        <input id="hdr" placeholder="Header" grow="1" height="22" action="fmt.header"/>
        <label text="F" width="12" height="22" fg="#E8EEF8"/>
        <input id="ftr" placeholder="Footer" grow="1" height="22" action="fmt.footer"/>
      </group>
    </group>
    <docview id="main" grow="1" paper="letter"/>
  </group>
</window>
