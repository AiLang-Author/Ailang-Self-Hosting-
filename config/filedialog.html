<window title="Open File" design-w="560" design-h="460" toolbar="about">
  <group layout="vbox" gap="4" padding="6" bg="#2D2D44">
    <group layout="hbox" gap="4" height="28">
      <button label="<-" action="fd.back" width="36" height="24" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="->" action="fd.fwd" width="36" height="24" bg="#3D3D50" fg="#E0E0E0"/>
      <label text="/" fg="#C0C0C0" text-align="left" grow="1" height="24" id="pathbar"/>
    </group>
    <group layout="hbox" gap="4" grow="1">
      <panel layout="vbox" gap="0" width="160" bg="#060912" border="1" padding="2" id="treepane"/>
      <panel layout="vbox" gap="1" grow="1" bg="#060912" border="1" padding="2" id="filelist"/>
    </group>
    <separator height="1" fg="#555555"/>
    <group layout="hbox" gap="4" height="32">
      <label text="" fg="#C0C0C0" text-align="left" grow="1" height="24" id="filename_lbl"/>
      <button label="Cancel" action="fd.cancel" width="70" height="24" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="Open" action="fd.ok" width="70" height="24" bg="#3D3D50" fg="#E0E0E0"/>
    </group>
  </group>
</window>
