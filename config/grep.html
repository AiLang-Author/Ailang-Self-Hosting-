<window title="Grep Search" design-w="640" design-h="360" toolbar="about">
  <group layout="vbox" gap="3" padding="6" bg="#2D2D44">
    <group layout="hbox" gap="4" height="24">
      <label text="Pattern:" fg="#C0C0C0" width="56" height="20"/>
      <textfield grow="1" height="20" bg="#1C1C2E" fg="#00FF88" border-color="#444444" padding="2"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="4" height="22">
      <label text="File:" fg="#C0C0C0" width="36" height="18"/>
      <label text="Main.ailang" fg="#00FF88" text-align="left" grow="1" height="18" bg="#1C1C2E" id="filepath"/>
    </group>
    <group layout="hbox" gap="2" height="22">
      <button label="Main" action="g.f0" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="Auckland" action="g.f1" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="AKBind" action="g.f2" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="AKEvent" action="g.f3" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="HTMLParse" action="g.f4" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="SysDisp" action="g.f5" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
    </group>
    <group layout="hbox" gap="2" height="22">
      <button label="WinMgr" action="g.f6" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="IPCBrok" action="g.f7" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="EvtRout" action="g.f8" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="FileDlg" action="g.f9" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="Deskbar" action="g.fa" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="grep" action="g.fb" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="6" height="20">
      <checkbox label="-i case" action="g.ci" height="18" fg="#E0E0E0"/>
      <checkbox label="-v inv" action="g.inv" height="18" fg="#E0E0E0"/>
      <checkbox label="-n num" action="g.ln" height="18" fg="#E0E0E0"/>
      <checkbox label="-c cnt" action="g.cnt" height="18" fg="#E0E0E0"/>
      <checkbox label="-F fix" action="g.fix" height="18" fg="#E0E0E0"/>
      <checkbox label="-w wrd" action="g.wm" height="18" fg="#E0E0E0"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="4" height="26">
      <button label="Search" action="g.run" width="80" height="22" bg="#00CC66" fg="#FFFFFF"/>
      <button label="Clear" action="g.clr" width="60" height="22" bg="#3D3D50" fg="#E0E0E0"/>
      <label text="Ready" fg="#C0C0C0" text-align="left" grow="1" height="22" id="status"/>
    </group>
    <panel layout="vbox" gap="1" grow="1" bg="#1C1C2E" border="1" padding="2" id="results"/>
  </group>
</window>
