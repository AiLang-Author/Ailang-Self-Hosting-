<window title="AILang IDE" design-w="480" design-h="320" toolbar="file">
  <group layout="vbox" gap="0" padding="0" bg="#1E1E2E">
    <group layout="hbox" gap="0" height="28" bg="#181825" padding="2" id="tabbar">
      <button label="Untitled" action="ide.tab0" height="24" bg="#1E1E2E" fg="#CDD6F4"/>
      <button label="+" action="ide.new" width="28" height="24" bg="#181825" fg="#6C7086"/>
    </group>
    <textfield grow="1" bg="#1E1E2E" fg="#CDD6F4" border-color="#313244" padding="4" syntax="ailang" line-numbers="1" id="editor"/>
    <group layout="hbox" gap="8" height="22" bg="#181825" padding="4">
      <label text="Ln 1, Col 1" fg="#6C7086" width="100" id="curpos"/>
      <label text="AILang" fg="#6C7086" width="60" id="lang"/>
      <label text="Ready" fg="#6C7086" grow="1" text-align="left" id="status"/>
      <label text="" fg="#6C7086" width="200" text-align="right" id="filepath"/>
    </group>
  </group>
</window>
