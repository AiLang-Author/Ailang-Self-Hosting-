<window title="Input Test" design-w="320" design-h="240" toolbar="about">

    <label text="Username:" fg="#E8EEF8"/>
    <input id="username" placeholder="Enter username" height="28"/>
    <label text="Password:" fg="#E8EEF8"/>
    <input id="password" type="password" placeholder="Enter password" height="28"/>
    <button label="Login" action="app.login" height="32" bg="#4A8CFF" fg="#E8EEF8"/>
  </group>
</window>
