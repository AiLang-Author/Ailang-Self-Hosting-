<window title="Package Manager" design-w="560" design-h="420" toolbar="about">
  <group layout="vbox" gap="3" padding="6" bg="#2D2D44">
    <group layout="hbox" gap="4" height="24">
      <label text="Packages: --/15" fg="#00FF88" text-align="left" grow="1" height="20" id="status"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="4" height="28">
      <button label="Scan"        action="pkg.scan"    width="70"  height="24" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="Install All" action="pkg.inst"    width="90"  height="24" bg="#00CC66" fg="#FFFFFF"/>
      <button label="Repair"      action="pkg.fix"     width="70"  height="24" bg="#FF9500" fg="#FFFFFF"/>
      <button label="Schema"      action="pkg.schema"  width="70"  height="24" bg="#3D3D50" fg="#E0E0E0"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="2" height="22">
      <button label="All"     action="pkg.fall" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="System"  action="pkg.fsys" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="Apps"    action="pkg.fapp" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="Missing" action="pkg.fmis" grow="1" height="20" bg="#3D3D50" fg="#E0E0E0"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="4" height="20">
      <label text="Ready" fg="#C0C0C0" text-align="left" grow="1" height="18" id="log"/>
    </group>
    <panel layout="vbox" gap="1" grow="1" bg="#1C1C2E" border="1" padding="2" id="results"/>
  </group>
</window>
