<window title="Settings" design-w="420" design-h="520" toolbar="about">
  <group layout="vbox" gap="4" padding="8" bg="#0E1730">

    <label text="System Settings" fg="#E8EEF8" font-size="20" height="28" text-align="center"/>
    <separator height="1" fg="#2A4068"/>

    <label text="Theme" fg="#7A8AAA" font-size="14" height="20"/>
    <group layout="hbox" gap="4" height="28">
      <label text="Active:" fg="#E8EEF8" width="60" height="24"/>
      <label text="dark" fg="#2AD4FF" grow="1" height="24" id="theme_name"/>
    </group>
    <group layout="hbox" gap="4" height="32">
      <button label="Dark"  action="s.theme.dark"  grow="1" height="28" bg="#16223F" fg="#E8EEF8"/>
      <button label="Light" action="s.theme.light" grow="1" height="28" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <separator height="1" fg="#2A4068"/>

    <label text="Font Sizes" fg="#7A8AAA" font-size="14" height="20"/>
    <group layout="hbox" gap="4" height="26">
      <label text="Body:" fg="#E8EEF8" width="70" height="22"/>
      <label text="18" fg="#2AD4FF" width="36" height="22" text-align="center" id="font_body"/>
      <button label="-" action="s.font_body.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.font_body.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Title:" fg="#E8EEF8" width="70" height="22"/>
      <label text="24" fg="#2AD4FF" width="36" height="22" text-align="center" id="font_title"/>
      <button label="-" action="s.font_title.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.font_title.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Menu:" fg="#E8EEF8" width="70" height="22"/>
      <label text="14" fg="#2AD4FF" width="36" height="22" text-align="center" id="font_menu"/>
      <button label="-" action="s.font_menu.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.font_menu.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Label:" fg="#E8EEF8" width="70" height="22"/>
      <label text="12" fg="#2AD4FF" width="36" height="22" text-align="center" id="font_label"/>
      <button label="-" action="s.font_label.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.font_label.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <separator height="1" fg="#2A4068"/>

    <label text="Layout" fg="#7A8AAA" font-size="14" height="20"/>
    <group layout="hbox" gap="4" height="26">
      <label text="Toolbar H:" fg="#E8EEF8" width="70" height="22"/>
      <label text="24" fg="#2AD4FF" width="36" height="22" text-align="center" id="toolbar_h"/>
      <button label="-" action="s.toolbar_h.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.toolbar_h.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Deskbar H:" fg="#E8EEF8" width="70" height="22"/>
      <label text="40" fg="#2AD4FF" width="36" height="22" text-align="center" id="deskbar_h"/>
      <button label="-" action="s.deskbar_h.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.deskbar_h.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Border W:" fg="#E8EEF8" width="70" height="22"/>
      <label text="4" fg="#2AD4FF" width="36" height="22" text-align="center" id="border_w"/>
      <button label="-" action="s.border_w.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.border_w.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Header H:" fg="#E8EEF8" width="70" height="22"/>
      <label text="24" fg="#2AD4FF" width="36" height="22" text-align="center" id="header_h"/>
      <button label="-" action="s.header_h.dn" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
      <button label="+" action="s.header_h.up" width="28" height="22" bg="#16223F" fg="#E8EEF8"/>
    </group>

    <spacer grow="1"/>
    <separator height="1" fg="#2A4068"/>

    <label text="" fg="#2AD4FF" height="18" id="status"/>
    <group layout="hbox" gap="4" height="32">
      <button label="Reset" action="s.reset" grow="1" height="28" bg="#CC3355" fg="#E8EEF8"/>
      <button label="Apply" action="s.apply" grow="1" height="28" bg="#4A8CFF" fg="#E8EEF8"/>
    </group>
  </group>
</window>
