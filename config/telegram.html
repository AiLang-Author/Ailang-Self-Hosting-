<window title="Telegram" design-w="920" design-h="580" toolbar="about">
  <group layout="hbox" gap="0" padding="0" grow="1" bg="#0E1621">
    <scroll id="chat-list" width="280" bg="#17212B">
      <group layout="vbox" gap="0" id="chat-items" padding="0"/>
    </scroll>
    <group layout="vbox" gap="0" grow="1" bg="#0E1621">
      <label id="chat-title" text="Connecting..." fg="#FFFFFF" height="44" padding="10" bg="#17212B"/>
      <scroll id="messages" grow="1" bg="#0E1621">
        <group layout="vbox" gap="6" id="message-items" padding="10"/>
      </scroll>
      <group layout="hbox" gap="6" height="52" padding="6" bg="#17212B">
        <textfield id="compose" grow="1" placeholder="Message..." bg="#242F3D" fg="#FFFFFF" border-color="#3C4A5C" padding="6"/>
        <button label="Send" action="tg.send" width="80" height="40" bg="#2AABEE" fg="#FFFFFF"/>
      </group>
    </group>
  </group>
</window>
