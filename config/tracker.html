<window title="Tracker" design-w="720" design-h="480" toolbar="file">
  <group layout="vbox" gap="0" padding="0" bg="#0E1730">
    <group layout="hbox" gap="4" padding="6" height="36" bg="#152238" shrink="0">
      <button label="Up" width="44" height="26" action="tk.up" bg="#2A4068" fg="#E8EEF8"/>
      <label id="tk_path" text="/" width="560" height="26" bg="#0A1020" fg="#E8EEF8"/>
    </group>
    <group layout="hbox" gap="0" grow="1" padding="0">
      <group layout="vbox" gap="3" padding="8" width="148" bg="#0A1020" shrink="0">
        <label text="PLACES" height="18" fg="#7A8AAA"/>
        <button label="Root" height="28" action="tk.place:0" bg="#2A4068" fg="#E8EEF8"/>
        <button label="Up" height="28" action="tk.up" bg="#1A2740" fg="#E8EEF8"/>
      </group>
      <group id="tk_grid" layout="grid" cols="4" gap="8" padding="12" grow="1" bg="#0E1730"/>
    </group>
    <label id="tk_stat" text="" height="24" bg="#152238" fg="#7A8AAA" shrink="0"/>
  </group>
</window>
