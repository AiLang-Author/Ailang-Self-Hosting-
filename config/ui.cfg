# UI Configuration — base values at 96 DPI / 1080p
# All values are in logical pixels at reference resolution.
# Actual pixel sizes are computed: value * screen_h / 1080
# Lines starting with # are comments. Blank lines ignored.

# Reference
ref_dpi=96
ref_height=1080

# Font sizes (logical px)
font_debug=12
font_menu=14
font_body=18
font_title=24
font_label=12

# Toolbar
toolbar_h=24
toolbar_btn_w=60
toolbar_btn_h=24
toolbar_close_w=28

# Deskbar
deskbar_h=40
deskbar_hotzone=2
deskbar_btn_w=64
deskbar_btn_h=32
deskbar_pad=4
deskbar_pad_lr=8
deskbar_gap=4

# Menu
menu_item_w=160
menu_item_h=26
menu_pad=4

# Window decorations
border_w=4
header_h=24

# Tabs
tab_max_w=72
tab_row_h=24
tab_icon_w=10
tab_pad=4
tab_font_h=14

# Dialog/modal sizing
# Fraction of parent window: numerator/denominator
dialog_frac_num=1
dialog_frac_den=3
dialog_min_w=200
dialog_min_h=150

