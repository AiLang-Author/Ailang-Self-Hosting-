# UI Configuration — base values at 96 DPI / 1080p
# All values are in logical pixels at reference resolution.
# Actual pixel sizes are computed: value * screen_h / 1080
# Lines starting with # are comments. Blank lines ignored.

# Reference
ref_dpi=96
ref_height=1080

# Font sizes (logical px)
font_debug=12
font_menu=14
font_body=18
font_title=24
font_label=12

# Chrome icon pack — SVG first, TVG fallback. A theme restyle is this
# directory (glyph_*.svg, tab_*.svg, btn_*.svg) plus the color keys below.
# Paths are loaded by name from WinChrome; tint comes from Theme at blit.
# chrome_dir=/system/icons/chrome

# Toolbar — logical px at 1080p; UIScale_Val maps these to the live DPI.
# Button height/close width are derived: toolbar_h - 2*toolbar_pad (square caps).
toolbar_h=24
toolbar_btn_w=44
toolbar_pad=3
toolbar_gap=3
toolbar_font_h=12
toolbar_border_w=1

# Deskbar
deskbar_h=40
deskbar_hotzone=2
deskbar_btn_w=64
deskbar_btn_h=32
deskbar_pad=4
deskbar_pad_lr=8
deskbar_gap=4

# Menu — item height is derived from toolbar_font_h + pad (DPI-safe).
menu_item_w=148

# Window decorations
border_w=4
header_h=40

# Pointer cursor — logical px at 1080p, scaled by screen height
cursor_size=24

# Tabs — tall enough to read the Haiku slide-tab silhouette
tab_max_w=72
tab_row_h=40
tab_icon_w=10
tab_pad=8
tab_font_h=16

# Dialog/modal sizing
# Fraction of parent window: numerator/denominator
dialog_frac_num=1
dialog_frac_den=3
dialog_min_w=200
dialog_min_h=150

# =============================================================================
