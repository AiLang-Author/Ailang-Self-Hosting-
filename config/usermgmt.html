<window title="User Management" design-w="460" design-h="480">
  <group layout="vbox" gap="4" padding="8" bg="#0E1730">

    <label text="User Management" fg="#E8EEF8" font-size="20" height="28" text-align="center"/>
    <separator height="1" fg="#2A4068"/>

    <label text="Users" fg="#7A8AAA" font-size="14" height="18"/>
    <label text="Loading..." fg="#E8EEF8" font-size="12" height="80" id="user_list" bg="#060912" border="#2A4068" padding="4"/>

    <separator height="1" fg="#2A4068"/>

    <label text="Create User" fg="#7A8AAA" font-size="14" height="18"/>
    <group layout="hbox" gap="4" height="26">
      <label text="User:" fg="#E8EEF8" width="50" height="22"/>
      <input id="new_username" placeholder="Username (3+)" grow="1" height="22" bg="#16223F" fg="#E8EEF8" border="#2A4068"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Pass:" fg="#E8EEF8" width="50" height="22"/>
      <input id="new_password" type="password" placeholder="Password (8+)" grow="1" height="22" bg="#16223F" fg="#E8EEF8" border="#2A4068"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Admin:" fg="#E8EEF8" width="50" height="22"/>
      <input id="new_is_admin" placeholder="1=yes, 0=no" grow="1" height="22" bg="#16223F" fg="#E8EEF8" border="#2A4068"/>
    </group>
    <button label="Create User" action="um.create_user" height="28" bg="#4A8CFF" fg="#E8EEF8"/>

    <separator height="1" fg="#2A4068"/>

    <label text="Delete User" fg="#7A8AAA" font-size="14" height="18"/>
    <group layout="hbox" gap="4" height="26">
      <label text="User:" fg="#E8EEF8" width="50" height="22"/>
      <input id="del_username" placeholder="Username to delete" grow="1" height="22" bg="#16223F" fg="#E8EEF8" border="#2A4068"/>
    </group>
    <button label="Delete User" action="um.delete_user" height="28" bg="#CC3355" fg="#E8EEF8"/>

    <separator height="1" fg="#2A4068"/>

    <label text="Change Password" fg="#7A8AAA" font-size="14" height="18"/>
    <group layout="hbox" gap="4" height="26">
      <label text="User:" fg="#E8EEF8" width="50" height="22"/>
      <input id="chpw_username" placeholder="Username" grow="1" height="22" bg="#16223F" fg="#E8EEF8" border="#2A4068"/>
    </group>
    <group layout="hbox" gap="4" height="26">
      <label text="Pass:" fg="#E8EEF8" width="50" height="22"/>
      <input id="chpw_password" type="password" placeholder="New password (8+)" grow="1" height="22" bg="#16223F" fg="#E8EEF8" border="#2A4068"/>
    </group>
    <button label="Change Password" action="um.change_password" height="28" bg="#16223F" fg="#E8EEF8" border="#2A4068"/>

    <spacer grow="1"/>
    <label text="" fg="#2AD4FF" height="16" id="status" text-align="center"/>
  </group>
</window>
