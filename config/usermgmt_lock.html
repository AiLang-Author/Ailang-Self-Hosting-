<window title="User Management" design-w="460" design-h="480">
  <group layout="vbox" gap="6" padding="12" bg="#0E1730">

    <label text="User Management" fg="#E8EEF8" font-size="20" height="28" text-align="center"/>
    <separator height="1" fg="#2A4068"/>

    <spacer height="12"/>

    <label text="Administrator login required" fg="#7A8AAA" font-size="14" height="20" text-align="center"/>

    <spacer height="8"/>

    <label text="Username" fg="#7A8AAA" font-size="12" height="16"/>
    <input id="username" placeholder="Enter username" height="28"/>

    <spacer height="4"/>

    <label text="Password" fg="#7A8AAA" font-size="12" height="16"/>
    <input id="password" type="password" placeholder="Enter password" height="28"/>

    <spacer grow="1"/>

    <label text="" fg="#CC3355" height="18" id="status" text-align="center"/>

    <button label="Unlock" action="um.authenticate" height="36" bg="#4A8CFF" fg="#E8EEF8" font-size="16"/>
  </group>
</window>
