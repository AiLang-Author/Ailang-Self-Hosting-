<window title="AILang OS Setup" design-w="460" design-h="380">
  <group layout="vbox" gap="6" padding="12" bg="#0E1730">

    <label text="Welcome to AILang OS" fg="#E8EEF8" font-size="22" height="32" text-align="center"/>
    <label text="Create your administrator account" fg="#7A8AAA" font-size="14" height="20" text-align="center"/>
    <separator height="1" fg="#2A4068"/>

    <spacer height="8"/>

    <label text="Username" fg="#7A8AAA" font-size="12" height="16"/>
    <input id="username" placeholder="Enter username" height="28"/>

    <spacer height="4"/>

    <label text="Password" fg="#7A8AAA" font-size="12" height="16"/>
    <input id="password" type="password" placeholder="Enter password" height="28"/>

    <spacer height="4"/>

    <label text="Confirm Password" fg="#7A8AAA" font-size="12" height="16"/>
    <input id="confirm" type="password" placeholder="Confirm password" height="28"/>

    <spacer grow="1"/>

    <label text="" fg="#CC3355" height="18" id="status" text-align="center"/>

    <button label="Create Account" action="um.create_admin" height="36" bg="#4A8CFF" fg="#E8EEF8" font-size="16"/>

    <spacer height="4"/>
    <label text="This replaces the default credentials" fg="#4A5A72" font-size="11" height="14" text-align="center"/>
  </group>
</window>
