<window title="Video Player" design-w="660" design-h="540" toolbar="about">
  <group layout="vbox" gap="2" padding="4" bg="#1A1A2E">
    <panel grow="1" bg="#000000" id="canvas"/>
    <separator height="1" fg="#333344"/>
    <group layout="hbox" gap="3" height="22">
      <label text="00:00" fg="#00CC88" width="40" height="18" text-align="right" id="pos"/>
      <label text="/" fg="#666666" width="10" height="18" text-align="center"/>
      <label text="00:00" fg="#888888" width="40" height="18" text-align="left" id="dur"/>
      <label text="Stopped" fg="#AAAACC" text-align="left" grow="1" height="18" id="status"/>
    </group>
    <separator height="1" fg="#333344"/>
    <group layout="hbox" gap="4" height="28">
      <button label="Open" action="v.open" width="52" height="24" bg="#3D3D60" fg="#E0E0E0"/>
      <button label="|<" action="v.rw" width="36" height="24" bg="#3D3D60" fg="#E0E0E0"/>
      <button label="Play" action="v.play" width="52" height="24" bg="#00AA55" fg="#FFFFFF"/>
      <button label="Pause" action="v.paus" width="52" height="24" bg="#CC8800" fg="#FFFFFF"/>
      <button label="Stop" action="v.stop" width="48" height="24" bg="#CC3333" fg="#FFFFFF"/>
      <button label=">|" action="v.ff" width="36" height="24" bg="#3D3D60" fg="#E0E0E0"/>
    </group>
  </group>
</window>
