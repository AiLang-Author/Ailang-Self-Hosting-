<window title="WiFi Config" design-w="480" design-h="380" toolbar="about">
  <group layout="vbox" gap="3" padding="6" bg="#2D2D44">
    <group layout="hbox" gap="4" height="24">
      <label text="WiFi: Not connected" fg="#FF9500" text-align="left" grow="1" height="20" id="status"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="4" height="28">
      <button label="Scan"       action="wf.scan"   width="70"  height="24" bg="#3D3D50" fg="#E0E0E0"/>
      <button label="Connect"    action="wf.conn"   width="80"  height="24" bg="#00CC66" fg="#FFFFFF"/>
      <button label="Disconnect" action="wf.disc"   width="90"  height="24" bg="#FF5555" fg="#FFFFFF"/>
      <button label="Status"     action="wf.stat"   width="70"  height="24" bg="#3D3D50" fg="#E0E0E0"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="4" height="28">
      <label text="SSID:" fg="#C0C0C0" width="42" height="24"/>
      <input id="ssid" placeholder="Network name" grow="1" height="24" action="wf.conn"/>
    </group>
    <group layout="hbox" gap="4" height="28">
      <label text="Pass:" fg="#C0C0C0" width="42" height="24"/>
      <input id="pass" type="password" placeholder="Password" grow="1" height="24" action="wf.conn"/>
    </group>
    <separator height="1" fg="#444444"/>
    <group layout="hbox" gap="4" height="20">
      <label text="Ready" fg="#C0C0C0" text-align="left" grow="1" height="18" id="log"/>
    </group>
    <panel layout="vbox" gap="1" grow="1" bg="#1C1C2E" border="1" padding="2" id="results"/>
  </group>
</window>
