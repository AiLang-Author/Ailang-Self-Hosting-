<window layout="vbox" design-w="600" design-h="500" gap="0">

  <!-- Toolbar -->
  <panel layout="hbox" height="36" gap="6"
         padding="4" pad-l="8" pad-r="8"
         bg="#2A2A3E"
         border="1" border-color="#444466">

    <button label="New Page"
            grow="1" height="28"
            fg="#FFFFFF" bg="#0064C8"
            action="doc.newpage" />

    <button label="Add Text"
            grow="1" height="28"
            fg="#FFFFFF" bg="#2E8B57"
            action="doc.addtext" />

    <button label="Clear"
            grow="1" height="28"
            fg="#FFFFFF" bg="#B42828"
            action="doc.clear" />

  </panel>

  <!-- Status bar -->
  <panel layout="hbox" height="24" padding="4" pad-l="8"
         bg="#1E1E32">
    <label text="AILANG Notepad - Page 1"
           height="20" fg="#78C8FF" text-align="left" />
  </panel>

  <!-- Document canvas area - grows to fill -->
  <panel bg="#808080" padding="4" grow="1">
    <canvas grow="1" />
  </panel>

</window>
