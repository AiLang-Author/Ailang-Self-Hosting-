<window layout="vbox" pad-t="120" pad-r="20" pad-b="20" pad-l="20" gap="12">

  <!-- Spacer pushes everything to bottom -->
  <spacer grow="1" />

  <!-- Status label -->
  <label text="Auckland Event Routing — Live"
         height="24"
         fg="#78C8FF"
         text-align="left" />

  <!-- Button panel at bottom -->
  <panel layout="hbox" height="50" gap="12"
         padding="5" pad-r="12" pad-l="12"
         bg="#1E1E32"
         border="1" border-color="#3C3C5A">

    <button label="New Window"
            grow="1" height="40"
            fg="#FFFFFF" bg="#0064C8"
            action="win.new" />

    <button label="Close Focused"
            grow="1" height="40"
            fg="#FFFFFF" bg="#B42828"
            action="win.close" />

    <button label="About"
            grow="1" height="40"
            fg="#FFFFFF" bg="#3C3C50"
            action="app.about" />

  </panel>

</window>
