<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="white"/>

  <!-- 1. Small circle (r=5) -->
  <circle cx="20" cy="20" r="5" fill="red"/>

  <!-- 2. Large circle filling most of the viewport (r=90) -->
  <circle cx="100" cy="100" r="90" fill="lightblue"/>

  <!-- 3. Circle at origin (cx=0, cy=0, so partially visible) -->
  <circle cx="0" cy="0" r="30" fill="green"/>

  <!-- 4. Circle with thick stroke (stroke-width="10") -->
  <circle cx="60" cy="60" r="25" fill="yellow" stroke="darkred" stroke-width="10"/>

  <!-- 5. Circle with stroke only (fill="none") -->
  <circle cx="150" cy="60" r="30" fill="none" stroke="blue" stroke-width="3"/>

  <!-- 6. Multiple overlapping circles -->
  <circle cx="80" cy="140" r="30" fill="red"/>
  <circle cx="110" cy="140" r="30" fill="green"/>
  <circle cx="95" cy="115" r="30" fill="blue"/>

  <!-- 7. Tiny circle (r=1) - minimum visible -->
  <circle cx="180" cy="20" r="1" fill="black"/>

  <!-- 8. Circle at bottom-right edge (partially clipped) -->
  <circle cx="190" cy="190" r="20" fill="purple"/>
</svg>
