<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="200" fill="white"/>

  <!-- Row 1: Primary and secondary hex colors -->
  <!-- 1. #FF0000 (red) -->
  <rect x="10" y="10" width="60" height="40" fill="#FF0000"/>
  <text x="15" y="65" font-size="8" fill="black">#FF0000</text>

  <!-- 2. #00FF00 (green) -->
  <rect x="80" y="10" width="60" height="40" fill="#00FF00"/>
  <text x="85" y="65" font-size="8" fill="black">#00FF00</text>

  <!-- 3. #0000FF (blue) -->
  <rect x="150" y="10" width="60" height="40" fill="#0000FF"/>
  <text x="155" y="65" font-size="8" fill="black">#0000FF</text>

  <!-- 4. #FFFF00 (yellow) -->
  <rect x="220" y="10" width="60" height="40" fill="#FFFF00"/>
  <text x="225" y="65" font-size="8" fill="black">#FFFF00</text>

  <!-- Row 2 -->
  <!-- 5. #FF00FF (magenta) -->
  <rect x="10" y="80" width="60" height="40" fill="#FF00FF"/>
  <text x="15" y="135" font-size="8" fill="black">#FF00FF</text>

  <!-- 6. #000000 (black) -->
  <rect x="80" y="80" width="60" height="40" fill="#000000"/>
  <text x="85" y="135" font-size="8" fill="black">#000000</text>

  <!-- 7. #808080 (gray) -->
  <rect x="150" y="80" width="60" height="40" fill="#808080"/>
  <text x="155" y="135" font-size="8" fill="black">#808080</text>

  <!-- 8. #FFFFFF with stroke (white rect with black stroke) -->
  <rect x="220" y="80" width="60" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="225" y="135" font-size="8" fill="black">#FFFFFF</text>

  <!-- Row 3: Additional hex edge cases -->
  <!-- 9. Lowercase hex -->
  <rect x="10" y="150" width="60" height="40" fill="#ff8800"/>
  <text x="15" y="198" font-size="8" fill="black">#ff8800</text>

  <!-- 10. Mixed case hex -->
  <rect x="80" y="150" width="60" height="40" fill="#aaBBcc"/>
  <text x="85" y="198" font-size="8" fill="black">#aaBBcc</text>

  <!-- 11. Short hex #RGB format (3-digit) -->
  <rect x="150" y="150" width="60" height="40" fill="#F0F"/>
  <text x="155" y="198" font-size="8" fill="black">#F0F</text>

  <!-- 12. Another 3-digit hex -->
  <rect x="220" y="150" width="60" height="40" fill="#369"/>
  <text x="225" y="198" font-size="8" fill="black">#369</text>
</svg>
