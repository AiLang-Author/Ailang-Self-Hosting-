<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="white"/>

  <!-- 1. Wide ellipse (rx=80, ry=20) -->
  <ellipse cx="100" cy="30" rx="80" ry="20" fill="cornflowerblue"/>

  <!-- 2. Tall ellipse (rx=20, ry=80) -->
  <ellipse cx="30" cy="120" rx="20" ry="80" fill="coral"/>

  <!-- 3. Very small ellipse (rx=3, ry=5) -->
  <ellipse cx="100" cy="100" rx="3" ry="5" fill="black"/>

  <!-- 4. Ellipse with stroke only -->
  <ellipse cx="140" cy="100" rx="40" ry="25" fill="none" stroke="darkgreen" stroke-width="3"/>

  <!-- 5. Multiple ellipses with different colors -->
  <ellipse cx="100" cy="160" rx="50" ry="15" fill="red"/>
  <ellipse cx="100" cy="160" rx="35" ry="10" fill="orange"/>
  <ellipse cx="100" cy="160" rx="20" ry="6" fill="yellow"/>

  <!-- 6. Ellipse with both fill and stroke -->
  <ellipse cx="140" cy="160" rx="30" ry="20" fill="lavender" stroke="purple" stroke-width="2"/>

  <!-- 7. Nearly circular ellipse -->
  <ellipse cx="70" cy="70" rx="15" ry="14" fill="teal"/>

  <!-- 8. Ellipse at edge (partially clipped) -->
  <ellipse cx="195" cy="100" rx="30" ry="50" fill="salmon"/>
</svg>
