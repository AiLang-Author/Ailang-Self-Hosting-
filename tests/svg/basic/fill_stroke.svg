<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Fill and Stroke Combinations Test</title>
  <!-- Fill only (no stroke) -->
  <rect x="10" y="10" width="50" height="50" fill="crimson" />
  <!-- Stroke only (no fill) -->
  <rect x="70" y="10" width="50" height="50" fill="none" stroke="navy" stroke-width="3" />
  <!-- Fill and stroke -->
  <rect x="140" y="10" width="50" height="50" fill="gold" stroke="black" stroke-width="2" />
  <!-- Dashed stroke -->
  <circle cx="35" cy="110" r="30" fill="lightcoral" stroke="darkred" stroke-width="2"
          stroke-dasharray="5,3" />
  <!-- Dotted stroke -->
  <circle cx="105" cy="110" r="30" fill="lightgreen" stroke="darkgreen" stroke-width="2"
          stroke-dasharray="2,4" />
  <!-- Wide stroke with round linecap and linejoin -->
  <polygon points="165,80 195,140 135,140" fill="lightskyblue" stroke="darkblue"
           stroke-width="4" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Stroke miter limit test -->
  <path d="M 20,170 L 60,160 L 20,190" fill="none" stroke="purple" stroke-width="4"
        stroke-linejoin="miter" stroke-miterlimit="8" />
  <!-- Butt vs square linecap -->
  <line x1="90" y1="170" x2="90" y2="195" stroke="black" stroke-width="6" stroke-linecap="butt" />
  <line x1="120" y1="170" x2="120" y2="195" stroke="black" stroke-width="6" stroke-linecap="square" />
  <line x1="150" y1="170" x2="150" y2="195" stroke="black" stroke-width="6" stroke-linecap="round" />
</svg>
