<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Linear Gradient Test</title>
  <defs>
    <!-- Horizontal gradient (left to right) -->
    <linearGradient id="horizGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="red" />
      <stop offset="100%" stop-color="blue" />
    </linearGradient>
    <!-- Vertical gradient (top to bottom) -->
    <linearGradient id="vertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="yellow" />
      <stop offset="50%" stop-color="green" />
      <stop offset="100%" stop-color="darkgreen" />
    </linearGradient>
    <!-- Diagonal gradient with multiple stops -->
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="33%" stop-color="#00ff00" />
      <stop offset="66%" stop-color="#0000ff" />
      <stop offset="100%" stop-color="#ff00ff" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="50" fill="url(#horizGrad)" />
  <rect x="10" y="75" width="180" height="50" fill="url(#vertGrad)" />
  <rect x="10" y="140" width="180" height="50" fill="url(#diagGrad)" rx="10" ry="10" />
</svg>
