<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Radial Gradient Test</title>
  <defs>
    <!-- Centered radial gradient -->
    <radialGradient id="centeredGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" />
      <stop offset="100%" stop-color="darkblue" />
    </radialGradient>
    <!-- Off-center focal point -->
    <radialGradient id="focalGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="yellow" />
      <stop offset="100%" stop-color="red" />
    </radialGradient>
    <!-- Multi-stop radial gradient -->
    <radialGradient id="multiGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" />
      <stop offset="30%" stop-color="gold" />
      <stop offset="60%" stop-color="orange" />
      <stop offset="100%" stop-color="darkred" />
    </radialGradient>
  </defs>
  <circle cx="55" cy="55" r="45" fill="url(#centeredGrad)" />
  <circle cx="145" cy="55" r="45" fill="url(#focalGrad)" />
  <rect x="30" y="120" width="140" height="70" rx="15" ry="15" fill="url(#multiGrad)" />
</svg>
