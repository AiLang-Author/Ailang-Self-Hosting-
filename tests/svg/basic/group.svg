<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Group (g) with Transform Test</title>
  <!-- Group translated to center area -->
  <g transform="translate(100, 100)">
    <rect x="-40" y="-30" width="80" height="60" fill="steelblue" />
    <circle cx="0" cy="0" r="20" fill="gold" />
    <text x="0" y="5" font-size="10" text-anchor="middle" fill="black">G</text>
  </g>
  <!-- Nested groups -->
  <g transform="translate(30, 30)">
    <g transform="translate(10, 10)">
      <rect x="0" y="0" width="30" height="30" fill="salmon" />
    </g>
  </g>
</svg>
