<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Nested SVG Test</title>
  <!-- Outer background -->
  <rect x="0" y="0" width="200" height="200" fill="#f0f0f0" />

  <!-- First nested SVG (top-left quadrant) -->
  <svg x="5" y="5" width="90" height="90" viewBox="0 0 50 50">
    <rect x="0" y="0" width="50" height="50" fill="lightyellow" stroke="gray" stroke-width="1" />
    <circle cx="25" cy="25" r="20" fill="red" />
    <text x="25" y="28" font-size="8" text-anchor="middle" fill="white">A</text>
  </svg>

  <!-- Second nested SVG (top-right quadrant) -->
  <svg x="105" y="5" width="90" height="90" viewBox="0 0 200 200">
    <rect x="0" y="0" width="200" height="200" fill="lightcyan" stroke="gray" stroke-width="2" />
    <polygon points="100,20 180,180 20,180" fill="blue" />
    <text x="100" y="140" font-size="30" text-anchor="middle" fill="white">B</text>
  </svg>

  <!-- Third nested SVG (bottom, spanning full width) -->
  <svg x="5" y="105" width="190" height="90" viewBox="0 0 100 50">
    <rect x="0" y="0" width="100" height="50" fill="lavender" stroke="gray" stroke-width="0.5" />
    <rect x="5" y="5" width="25" height="40" fill="green" rx="5" ry="5" />
    <rect x="37" y="5" width="25" height="40" fill="orange" rx="5" ry="5" />
    <rect x="69" y="5" width="25" height="40" fill="purple" rx="5" ry="5" />
    <text x="50" y="48" font-size="4" text-anchor="middle" fill="black">Nested viewBox 0 0 100 50</text>
  </svg>
</svg>
