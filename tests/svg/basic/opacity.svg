<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Opacity Test</title>
  <!-- Background reference rectangles -->
  <rect x="0" y="0" width="200" height="200" fill="#dddddd" />
  <rect x="20" y="20" width="160" height="160" fill="white" />

  <!-- fill-opacity variations -->
  <rect x="30" y="30" width="60" height="60" fill="red" fill-opacity="1.0" />
  <rect x="50" y="50" width="60" height="60" fill="blue" fill-opacity="0.7" />
  <rect x="70" y="70" width="60" height="60" fill="green" fill-opacity="0.4" />

  <!-- stroke-opacity variations -->
  <circle cx="150" cy="60" r="35" fill="none" stroke="red" stroke-width="6" stroke-opacity="1.0" />
  <circle cx="150" cy="60" r="25" fill="none" stroke="blue" stroke-width="6" stroke-opacity="0.5" />
  <circle cx="150" cy="60" r="15" fill="none" stroke="green" stroke-width="6" stroke-opacity="0.25" />

  <!-- Overall opacity attribute -->
  <rect x="30" y="140" width="50" height="40" fill="purple" opacity="1.0" />
  <rect x="70" y="140" width="50" height="40" fill="purple" opacity="0.6" />
  <rect x="110" y="140" width="50" height="40" fill="purple" opacity="0.3" />
</svg>
