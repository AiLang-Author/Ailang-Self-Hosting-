<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Path Arcs Test (A command)</title>
  <!-- Arc: large-arc-flag=0, sweep-flag=1 -->
  <path d="M 30,100 A 50,50 0 0,1 130,100"
        fill="none" stroke="green" stroke-width="3" />
  <!-- Arc: large-arc-flag=1, sweep-flag=1 -->
  <path d="M 30,100 A 50,50 0 1,1 130,100"
        fill="none" stroke="blue" stroke-width="3" />
  <!-- Arc: large-arc-flag=0, sweep-flag=0 -->
  <path d="M 30,100 A 50,50 0 0,0 130,100"
        fill="none" stroke="red" stroke-width="3" />
  <!-- Arc: large-arc-flag=1, sweep-flag=0 -->
  <path d="M 30,100 A 50,50 0 1,0 130,100"
        fill="none" stroke="orange" stroke-width="3" />
  <!-- Elliptical arc with rotation -->
  <path d="M 50,170 A 60,30 30 0,1 170,170"
        fill="none" stroke="purple" stroke-width="2" />
</svg>
