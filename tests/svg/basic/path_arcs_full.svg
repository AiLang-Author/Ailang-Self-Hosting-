<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" fill="white"/>

  <!-- Labels as visual reference -->
  <text x="10" y="15" font-size="10" fill="gray">Arc flag combinations (r=40)</text>

  <!-- 1. Arc with large-arc-flag=0, sweep-flag=0 -->
  <path d="M 50,100 A 40,40 0 0,0 130,100" fill="none" stroke="red" stroke-width="3"/>
  <text x="50" y="85" font-size="9" fill="red">LA=0 SW=0</text>
  <!-- Show endpoints -->
  <circle cx="50" cy="100" r="3" fill="red"/>
  <circle cx="130" cy="100" r="3" fill="red"/>

  <!-- 2. Arc with large-arc-flag=0, sweep-flag=1 -->
  <path d="M 200,100 A 40,40 0 0,1 280,100" fill="none" stroke="blue" stroke-width="3"/>
  <text x="200" y="85" font-size="9" fill="blue">LA=0 SW=1</text>
  <circle cx="200" cy="100" r="3" fill="blue"/>
  <circle cx="280" cy="100" r="3" fill="blue"/>

  <!-- 3. Arc with large-arc-flag=1, sweep-flag=0 -->
  <path d="M 50,200 A 40,40 0 1,0 130,200" fill="none" stroke="green" stroke-width="3"/>
  <text x="50" y="185" font-size="9" fill="green">LA=1 SW=0</text>
  <circle cx="50" cy="200" r="3" fill="green"/>
  <circle cx="130" cy="200" r="3" fill="green"/>

  <!-- 4. Arc with large-arc-flag=1, sweep-flag=1 -->
  <path d="M 200,200 A 40,40 0 1,1 280,200" fill="none" stroke="purple" stroke-width="3"/>
  <text x="200" y="185" font-size="9" fill="purple">LA=1 SW=1</text>
  <circle cx="200" cy="200" r="3" fill="purple"/>
  <circle cx="280" cy="200" r="3" fill="purple"/>

  <!-- 5. Elliptical arc (rx != ry) -->
  <path d="M 30,300 A 60,30 0 0,1 150,300" fill="none" stroke="darkorange" stroke-width="3"/>
  <text x="30" y="340" font-size="9" fill="darkorange">Elliptical rx=60 ry=30</text>

  <!-- 6. Arc with x-axis-rotation=45 -->
  <path d="M 200,290 A 50,25 45 0,1 300,310" fill="none" stroke="teal" stroke-width="3"/>
  <text x="200" y="340" font-size="9" fill="teal">x-rot=45</text>

  <!-- 7. Small arc (r=10) -->
  <path d="M 330,290 A 10,10 0 0,1 350,290" fill="none" stroke="crimson" stroke-width="2"/>
  <text x="320" y="340" font-size="9" fill="crimson">r=10</text>

  <!-- 8. Large arc (r=80) -->
  <path d="M 100,370 A 80,80 0 0,1 300,370" fill="none" stroke="navy" stroke-width="3"/>
  <text x="160" y="395" font-size="9" fill="navy">r=80</text>

  <!-- 9. Filled arc shape (pie slice) -->
  <path d="M 340,100 L 340,100 A 40,40 0 0,1 380,140 L 340,140 Z" fill="gold"/>

  <!-- 10. Consecutive arcs forming a wavy line -->
  <path d="M 30,370 A 20,20 0 0,1 70,370 A 20,20 0 0,0 110,370 A 20,20 0 0,1 150,370" fill="none" stroke="sienna" stroke-width="2"/>
</svg>
