<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" fill="white"/>

  <!-- 1. M/L absolute: triangle -->
  <path d="M 20,80 L 60,10 L 100,80 Z" fill="red"/>

  <!-- 2. m/l relative: square offset from (120,10) -->
  <path d="M 120,10 l 70,0 l 0,70 l -70,0 Z" fill="blue"/>

  <!-- 3. H/V absolute: cross shape -->
  <path d="M 240,30 H 280 V 10 H 300 V 30 H 340 V 50 H 300 V 70 H 280 V 50 H 240 Z" fill="green"/>

  <!-- 4. h/v relative: small stepped shape -->
  <path d="M 360,10 h 20 v 20 h -10 v 20 h -10 v -20 h -10 v -20 Z" fill="orange"/>

  <!-- 5. C absolute: smooth S-curve -->
  <path d="M 20,120 C 20,160 80,160 80,200 C 80,240 140,240 140,200" fill="none" stroke="purple" stroke-width="3"/>

  <!-- 6. c relative: another curve -->
  <path d="M 160,120 c 0,40 60,40 60,80 c 0,40 60,40 60,0" fill="none" stroke="darkred" stroke-width="3"/>

  <!-- 7. S absolute: smooth cubic continuation -->
  <path d="M 20,280 C 40,260 60,260 80,280 S 120,300 140,280 S 180,260 200,280" fill="none" stroke="teal" stroke-width="3"/>

  <!-- 8. Q absolute: quadratic curve -->
  <path d="M 20,340 Q 70,300 120,340" fill="none" stroke="darkblue" stroke-width="3"/>

  <!-- 9. T absolute: smooth quadratic continuation -->
  <path d="M 140,340 Q 170,310 200,340 T 260,340 T 320,340" fill="none" stroke="brown" stroke-width="3"/>

  <!-- 10. Complex filled path using multiple command types -->
  <path d="M 300,120 L 380,120 L 380,200 Q 340,240 300,200 Z" fill="gold"/>

  <!-- 11. Path with M move mid-path (multiple subpaths) -->
  <path d="M 250,120 L 290,120 L 290,160 Z M 250,170 L 290,170 L 290,210 Z" fill="crimson"/>

  <!-- 12. Single line segment -->
  <path d="M 300,280 L 380,340" fill="none" stroke="black" stroke-width="2"/>

  <!-- 13. Closed triangle with thick stroke -->
  <path d="M 300,250 L 350,250 L 325,220 Z" fill="none" stroke="magenta" stroke-width="4"/>
</svg>
