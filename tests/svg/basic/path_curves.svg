<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Path Curves Test (C and Q)</title>
  <!-- Cubic Bezier: C command -->
  <path d="M 10,100 C 10,10 90,10 90,100"
        fill="none" stroke="blue" stroke-width="3" />
  <!-- Cubic Bezier: S (smooth) command -->
  <path d="M 10,100 C 10,10 90,10 90,100 S 170,190 170,100"
        fill="none" stroke="cornflowerblue" stroke-width="2" stroke-dasharray="6,3" />
  <!-- Quadratic Bezier: Q command -->
  <path d="M 10,180 Q 100,80 190,180"
        fill="none" stroke="red" stroke-width="3" />
  <!-- Quadratic Bezier: T (smooth) command -->
  <path d="M 10,150 Q 55,100 100,150 T 190,150"
        fill="none" stroke="tomato" stroke-width="2" stroke-dasharray="6,3" />
</svg>
