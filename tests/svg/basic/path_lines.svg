<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Path Lines Test (M, L, H, V, Z)</title>
  <!-- A house shape using M, L, H, V, Z commands -->
  <path d="M 30,150 L 30,80 L 100,20 L 170,80 L 170,150 H 30 Z"
        fill="lightyellow" stroke="brown" stroke-width="3" />
  <!-- A window using relative commands -->
  <path d="M 70,90 l 0,30 l 30,0 l 0,-30 z"
        fill="lightblue" stroke="brown" stroke-width="2" />
  <!-- Door using V and H -->
  <path d="M 110,150 V 110 H 140 V 150"
        fill="saddlebrown" stroke="brown" stroke-width="2" />
</svg>
