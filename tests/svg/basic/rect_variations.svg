<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="white"/>

  <!-- 1. Plain rect with just x,y,width,height and fill -->
  <rect x="10" y="10" width="40" height="30" fill="blue"/>

  <!-- 2. Rect with rounded corners (rx only) -->
  <rect x="60" y="10" width="40" height="30" fill="green" rx="8"/>

  <!-- 3. Rect with rounded corners (ry only) -->
  <rect x="110" y="10" width="40" height="30" fill="orange" ry="8"/>

  <!-- 4. Rect with both rx and ry -->
  <rect x="10" y="55" width="40" height="30" fill="purple" rx="10" ry="5"/>

  <!-- 5. Rect at negative coordinates (partially clipped) -->
  <rect x="-10" y="-10" width="40" height="40" fill="red"/>

  <!-- 6. Rect with stroke only (fill="none") -->
  <rect x="60" y="55" width="40" height="30" fill="none" stroke="red" stroke-width="3"/>

  <!-- 7. Rect positioned at the very edge of viewBox (right/bottom edge) -->
  <rect x="170" y="170" width="30" height="30" fill="teal"/>

  <!-- 8. Additional: zero-size corner radius -->
  <rect x="10" y="100" width="40" height="30" fill="gold" rx="0" ry="0"/>

  <!-- 9. Additional: rect with both fill and stroke -->
  <rect x="60" y="100" width="40" height="30" fill="lightblue" stroke="darkblue" stroke-width="2"/>

  <!-- 10. Very thin rect (1px height) -->
  <rect x="10" y="145" width="80" height="1" fill="black"/>

  <!-- 11. Very thin rect (1px width) -->
  <rect x="100" y="100" width="1" height="80" fill="black"/>

  <!-- 12. Rect with large corner radii (clamped to half dimension) -->
  <rect x="110" y="55" width="40" height="30" fill="salmon" rx="50" ry="50"/>

  <!-- 13. Square rect -->
  <rect x="120" y="100" width="30" height="30" fill="mediumpurple"/>

  <!-- 14. Rect touching top-left origin exactly -->
  <rect x="0" y="0" width="5" height="5" fill="black"/>
</svg>
