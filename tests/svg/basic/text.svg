<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Text Test</title>
  <text x="100" y="50" font-family="serif" font-size="24" fill="black"
        text-anchor="middle">Hello SVG</text>
  <text x="100" y="100" font-family="sans-serif" font-size="16" fill="darkblue"
        text-anchor="middle" font-weight="bold">Bold Sans-Serif</text>
  <text x="100" y="140" font-family="monospace" font-size="14" fill="darkgreen"
        text-anchor="middle" font-style="italic">Italic Monospace</text>
  <text x="100" y="180" font-size="12" fill="gray" text-anchor="middle"
        text-decoration="underline">Underlined Text</text>
</svg>
