<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <title>Transform Test (translate, rotate, scale)</title>
  <!-- Reference grid lines -->
  <line x1="100" y1="0" x2="100" y2="200" stroke="#eee" stroke-width="1" />
  <line x1="0" y1="100" x2="200" y2="100" stroke="#eee" stroke-width="1" />

  <!-- Translate -->
  <rect x="0" y="0" width="30" height="20" fill="red" transform="translate(10, 10)" />

  <!-- Rotate around center -->
  <rect x="-20" y="-10" width="40" height="20" fill="blue"
        transform="translate(100, 50) rotate(45)" />

  <!-- Scale -->
  <rect x="0" y="0" width="20" height="15" fill="green"
        transform="translate(150, 10) scale(2)" />

  <!-- Scale non-uniform -->
  <rect x="0" y="0" width="20" height="20" fill="orange"
        transform="translate(10, 130) scale(2, 1.5)" />

  <!-- Rotate around a specific point -->
  <rect x="80" y="110" width="40" height="30" fill="purple"
        transform="rotate(30, 100, 125)" />

  <!-- Combined transforms -->
  <rect x="0" y="0" width="25" height="25" fill="teal"
        transform="translate(160, 150) rotate(60) scale(1.2)" />

  <!-- SkewX -->
  <rect x="0" y="0" width="30" height="20" fill="coral"
        transform="translate(10, 80) skewX(20)" />

  <!-- SkewY -->
  <rect x="0" y="0" width="30" height="20" fill="olive"
        transform="translate(60, 80) skewY(15)" />
</svg>
