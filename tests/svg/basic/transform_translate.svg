<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" fill="white"/>

  <!-- Reference crosshairs at origin -->
  <line x1="0" y1="0" x2="200" y2="0" stroke="lightgray" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="200" stroke="lightgray" stroke-width="1"/>

  <!-- 1. Rect with translate(50, 50) - should appear at (50,50) -->
  <rect x="0" y="0" width="30" height="20" fill="red" transform="translate(50, 50)"/>

  <!-- 2. Circle with translate(100, 100) - center at (100,100) -->
  <circle cx="0" cy="0" r="15" fill="blue" transform="translate(100, 100)"/>

  <!-- 3. Nested group: outer translate(20,20), inner translate(30,30) = effective (50,50) -->
  <g transform="translate(20, 20)">
    <g transform="translate(30, 30)">
      <!-- This 10x10 rect at (0,0) should appear at (50,50) -->
      <rect x="0" y="0" width="10" height="10" fill="green"/>
    </g>
  </g>

  <!-- 4. Translate with single value (y defaults to 0) -->
  <rect x="0" y="0" width="20" height="15" fill="orange" transform="translate(150)"/>

  <!-- 5. Translate to negative position (partially off-screen) -->
  <rect x="0" y="0" width="30" height="30" fill="purple" transform="translate(-10, 170)"/>

  <!-- 6. Translate a group of shapes together -->
  <g transform="translate(120, 140)">
    <rect x="0" y="0" width="40" height="40" fill="lightblue" stroke="navy" stroke-width="2"/>
    <circle cx="20" cy="20" r="10" fill="navy"/>
  </g>

  <!-- Reference: un-translated rect at origin for comparison -->
  <rect x="0" y="0" width="5" height="5" fill="black"/>
</svg>
