<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 100 100">
  <title>ViewBox Test</title>
  <!-- The viewBox is 100x100 but the SVG element is 200x200,
       so everything is scaled up 2x. -->
  <!-- Border to show the viewBox extent -->
  <rect x="0" y="0" width="100" height="100" fill="none" stroke="gray" stroke-width="0.5" />
  <!-- Content drawn in viewBox coordinates -->
  <circle cx="25" cy="25" r="15" fill="red" />
  <circle cx="75" cy="25" r="15" fill="blue" />
  <circle cx="25" cy="75" r="15" fill="green" />
  <circle cx="75" cy="75" r="15" fill="orange" />
  <circle cx="50" cy="50" r="10" fill="purple" />
  <!-- Text in viewBox coordinates -->
  <text x="50" y="98" font-size="6" text-anchor="middle" fill="black">viewBox 0 0 100 100</text>
</svg>
