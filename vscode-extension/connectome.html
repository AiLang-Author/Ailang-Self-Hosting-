<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111118; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; }
canvas { display:block; cursor:grab; }
canvas.dragging { cursor:grabbing; }
#hud {
    position:fixed; top:8px; left:8px; right:8px;
    display:flex; gap:8px; align-items:center; z-index:10; pointer-events:none;
}
#hud > * { pointer-events:auto; }
#search {
    background:#1e1e2e; border:1px solid #333; border-radius:4px;
    color:#d4d4d4; padding:5px 10px; font-size:12px; width:200px; outline:none;
}
#search:focus { border-color:#a855f7; }
.filter-btn {
    background:#1e1e2e; border:1px solid #333; border-radius:4px;
    color:#888; padding:4px 8px; font-size:11px; cursor:pointer; transition:all 0.15s;
}
.filter-btn:hover { border-color:#555; color:#ccc; }
.filter-btn.active { border-color:var(--fc); color:var(--fc); background:rgba(255,255,255,0.05); }
#stats { margin-left:auto; color:#444; font-size:10px; letter-spacing:0.5px; }
#tooltip {
    display:none; position:fixed; background:#1e1e2e; border:1px solid #444;
    border-radius:6px; padding:10px 14px; color:#d4d4d4; font-size:12px;
    z-index:20; pointer-events:none; max-width:300px; box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
#tooltip .tt-kind { font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
#tooltip .tt-name { font-size:14px; font-weight:600; margin-bottom:6px; }
#tooltip .tt-detail { color:#888; font-size:11px; }
#tooltip .tt-hint { color:#555; font-size:10px; margin-top:6px; border-top:1px solid #2a2a2a; padding-top:6px; }
#detail-panel {
    display:none; position:fixed; right:0; top:0; bottom:0; width:280px;
    background:#161622; border-left:1px solid #2a2a2a; z-index:15;
    padding:16px; overflow-y:auto; color:#d4d4d4;
}
#detail-panel .dp-close { position:absolute; top:8px; right:12px; cursor:pointer; color:#666; font-size:18px; line-height:1; }
#detail-panel .dp-close:hover { color:#fff; }
#detail-panel .dp-kind { font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
#detail-panel .dp-name { font-size:18px; font-weight:700; margin-bottom:4px; }
#detail-panel .dp-scope { font-size:12px; color:#888; margin-bottom:12px; }
#detail-panel .dp-section { margin-bottom:12px; }
#detail-panel .dp-section-title { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:#666; margin-bottom:6px; }
#detail-panel .dp-link {
    display:block; padding:4px 8px; margin:2px 0; border-radius:3px;
    color:#a855f7; font-size:12px; cursor:pointer; text-decoration:none; transition:background 0.1s;
}
#detail-panel .dp-link:hover { background:rgba(168,85,247,0.1); }
#detail-panel .dp-goto {
    display:inline-block; margin-top:8px; padding:6px 14px;
    background:#a855f7; color:#fff; border:none; border-radius:4px;
    font-size:12px; cursor:pointer; transition:opacity 0.15s;
}
#detail-panel .dp-goto:hover { opacity:0.85; }
#legend {
    position:fixed; bottom:8px; left:8px; display:flex; gap:10px;
    font-size:10px; color:#555; z-index:10;
}
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-dot { width:8px; height:8px; border-radius:50%; }
</style>
</head>
<!--SPLIT-->
<body>
<div id="hud">
    <input id="search" type="text" placeholder="Search symbols..." autocomplete="off">
    <button class="filter-btn active" data-group="all" style="--fc:#fff">All</button>
    <button class="filter-btn active" data-group="Imports" style="--fc:#e94560">Imports</button>
    <button class="filter-btn active" data-group="Pools" style="--fc:#0f8bff">Pools</button>
    <button class="filter-btn active" data-group="Functions" style="--fc:#a855f7">Functions</button>
    <button class="filter-btn active" data-group="SubRoutines" style="--fc:#f97316">SubRoutines</button>
    <button class="filter-btn active" data-group="Loops" style="--fc:#16a085">Loops</button>
    <div id="file-filters" style="display:flex;gap:4px;flex-wrap:wrap;max-width:50%;max-height:46px;overflow-y:auto;"></div>
    <span id="stats"></span>
</div>
<div id="tooltip"><div class="tt-kind"></div><div class="tt-name"></div><div class="tt-detail"></div><div class="tt-hint"></div></div>
<div id="detail-panel">
    <span class="dp-close">&times;</span>
    <div class="dp-kind"></div>
    <div class="dp-name"></div>
    <div class="dp-scope"></div>
    <div id="dp-calls-out" class="dp-section"></div>
    <div id="dp-calls-in" class="dp-section"></div>
    <div id="dp-children" class="dp-section"></div>
    <button class="dp-goto" id="dp-goto">Go to Definition</button>
    <button class="dp-goto" id="dp-open-file" style="display:none;background:#e94560;margin-left:4px;">Open File</button>
</div>
<div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#e94560"></div>Import</div>
    <div class="legend-item"><div class="legend-dot" style="background:#0f8bff"></div>Pool</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div>Function</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>SubRoutine</div>
    <div class="legend-item"><div class="legend-dot" style="background:#16a085"></div>Loop</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Cross-file</div>
</div>
<canvas id="c"></canvas>
<script>
(function(){
var vscode = acquireVsCodeApi();
var data = window.__graphData || { nodes: [], edges: [], imports: [] };
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var tooltip = document.getElementById('tooltip');
var detail = document.getElementById('detail-panel');
var searchInput = document.getElementById('search');
var statsEl = document.getElementById('stats');

var W, H, dpr;
function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', function() { resize(); draw(); });

var nodes = data.nodes.map(function(n, i) {
    var angle = (i / data.nodes.length) * Math.PI * 2;
    var r = 120 + Math.random() * 80;
    return {
        id: n.id, label: n.label, kind: n.kind, group: n.group,
        color: n.color, line: n.line, scope: n.scope, file: n.file,
        x: W/2 + Math.cos(angle) * r,
        y: H/2 + Math.sin(angle) * r,
        vx: 0, vy: 0,
        radius: n.group === 'Fields' ? 6 : (n.kind === 'SubRoutine' ? 14 : 10),
        visible: true, matched: true
    };
});
var nodeMap = {};
nodes.forEach(function(n) { nodeMap[n.id] = n; });

var fileColorPalette = [
    '#e94560','#0f8bff','#a855f7','#f97316','#16a085',
    '#eab308','#ec4899','#06b6d4','#84cc16','#f43f5e',
    '#8b5cf6','#14b8a6','#f59e0b','#6366f1','#22d3ee',
    '#d946ef','#10b981','#fb923c','#3b82f6','#ef4444'
];
var fileColors = {};
var fileSet = {};
nodes.forEach(function(n) { fileSet[n.file] = true; });
var fileList = Object.keys(fileSet).sort();
var fileColorIdx = 0;
fileList.forEach(function(f) {
    fileColors[f] = fileColorPalette[fileColorIdx % fileColorPalette.length];
    fileColorIdx++;
});

var activeFiles = {};
fileList.forEach(function(f) { activeFiles[f] = true; });

var fileFilterContainer = document.getElementById('file-filters');
if (fileList.length > 1) {
    var allBtn = document.createElement('button');
    allBtn.className = 'filter-btn active';
    allBtn.setAttribute('data-file', '__all__');
    allBtn.textContent = 'All Files';
    allBtn.style.cssText = '--fc:#fff;font-size:9px;padding:2px 6px;';
    fileFilterContainer.appendChild(allBtn);
    fileList.forEach(function(f) {
        var btn = document.createElement('button');
        btn.className = 'filter-btn active';
        btn.setAttribute('data-file', f);
        btn.textContent = f;
        btn.style.cssText = '--fc:' + fileColors[f] + ';font-size:9px;padding:2px 6px;';
        fileFilterContainer.appendChild(btn);
    });
    fileFilterContainer.addEventListener('click', function(e) {
        var btn = e.target.closest('.filter-btn');
        if (!btn) return;
        var f = btn.getAttribute('data-file');
        if (f === '__all__') {
            var allActive = Object.keys(activeFiles).length === fileList.length;
            fileFilterContainer.querySelectorAll('.filter-btn').forEach(function(b) {
                if (allActive) { b.classList.remove('active'); activeFiles = {}; }
                else { b.classList.add('active'); if (b.getAttribute('data-file') !== '__all__') activeFiles[b.getAttribute('data-file')] = true; }
            });
        } else {
            btn.classList.toggle('active');
            if (activeFiles[f]) delete activeFiles[f]; else activeFiles[f] = true;
        }
        updateVisibility();
        simCooldown = Math.max(simCooldown, 120);
    });
}

var edges = data.edges.map(function(e) {
    return { source: nodeMap[e.from], target: nodeMap[e.to], type: e.type || 'call', crossFile: e.crossFile };
}).filter(function(e) { return e.source && e.target; });

var activeGroups = {Imports:true, Pools:true, Functions:true, SubRoutines:true, Loops:true, Fields:true, Exports:true, Macros:true};
document.querySelectorAll('.filter-btn[data-group]').forEach(function(btn) {
    btn.addEventListener('click', function() {
        var g = btn.getAttribute('data-group');
        if (!g) return;
        if (g === 'all') {
            var allBtns = document.querySelectorAll('.filter-btn[data-group]');
            var allActive = true;
            allBtns.forEach(function(b) { if (!b.classList.contains('active')) allActive = false; });
            allBtns.forEach(function(b) {
                if (allActive) { b.classList.remove('active'); activeGroups = {}; }
                else { b.classList.add('active'); if(b.getAttribute('data-group')!=='all') activeGroups[b.getAttribute('data-group')] = true; }
            });
        } else {
            btn.classList.toggle('active');
            if (activeGroups[g]) delete activeGroups[g]; else activeGroups[g] = true;
        }
        updateVisibility();
    });
});

searchInput.addEventListener('input', function() { updateVisibility(); });

function updateVisibility() {
    var q = searchInput.value.toLowerCase().trim();
    nodes.forEach(function(n) {
        n.matched = !q || n.id.toLowerCase().indexOf(q) >= 0 || n.kind.toLowerCase().indexOf(q) >= 0
                       || n.file.toLowerCase().indexOf(q) >= 0;
        n.visible = !!activeGroups[n.group] && !!activeFiles[n.file] && n.matched;
    });
}

var camX = 0, camY = 0, camZoom = 1;
var dragStart = null, dragCam = null, dragNode = null;
var hoveredNode = null, selectedNode = null;

function screenToWorld(sx, sy) {
    return { x: (sx - W/2) / camZoom + W/2 - camX, y: (sy - H/2) / camZoom + H/2 - camY };
}

function hitTest(mx, my) {
    var p = screenToWorld(mx, my);
    for (var i = nodes.length - 1; i >= 0; i--) {
        var n = nodes[i];
        if (!n.visible) continue;
        var dx = p.x - n.x, dy = p.y - n.y;
        if (dx*dx + dy*dy < (n.radius + 4) * (n.radius + 4)) return n;
    }
    return null;
}

canvas.addEventListener('mousedown', function(e) {
    var n = hitTest(e.clientX, e.clientY);
    if (n) { dragNode = n; canvas.classList.add('dragging'); }
    else { dragStart = { x: e.clientX, y: e.clientY }; dragCam = { x: camX, y: camY }; canvas.classList.add('dragging'); }
});
canvas.addEventListener('mousemove', function(e) {
    if (dragNode) {
        var p = screenToWorld(e.clientX, e.clientY);
        dragNode.x = p.x; dragNode.y = p.y; dragNode.vx = 0; dragNode.vy = 0;
    } else if (dragStart) {
        camX = dragCam.x + (e.clientX - dragStart.x) / camZoom;
        camY = dragCam.y + (e.clientY - dragStart.y) / camZoom;
    } else {
        var n = hitTest(e.clientX, e.clientY);
        hoveredNode = n;
        if (n) { canvas.style.cursor = 'pointer'; showTooltip(n, e.clientX, e.clientY); }
        else { canvas.style.cursor = 'grab'; tooltip.style.display = 'none'; }
    }
});
canvas.addEventListener('mouseup', function() { dragNode = null; dragStart = null; dragCam = null; canvas.classList.remove('dragging'); });
canvas.addEventListener('click', function(e) { var n = hitTest(e.clientX, e.clientY); if (n) { selectedNode = n; showDetail(n); } });
canvas.addEventListener('dblclick', function(e) { var n = hitTest(e.clientX, e.clientY); if (n) vscode.postMessage({ type: 'goto', line: n.line, id: n.id }); });
canvas.addEventListener('wheel', function(e) { e.preventDefault(); var factor = e.deltaY > 0 ? 0.92 : 1.08; camZoom = Math.max(0.15, Math.min(5, camZoom * factor)); }, { passive: false });

function showTooltip(n, mx, my) {
    tooltip.querySelector('.tt-kind').textContent = n.kind;
    tooltip.querySelector('.tt-kind').style.color = n.color;
    tooltip.querySelector('.tt-name').textContent = n.id;
    var callsOut = edges.filter(function(e) { return e.source.id === n.id && e.type === 'call'; }).map(function(e) { return e.target.id; });
    var callsIn = edges.filter(function(e) { return e.target.id === n.id && e.type === 'call'; }).map(function(e) { return e.source.id; });
    var det = '';
    if (callsOut.length) det += 'Calls: ' + callsOut.join(', ') + '\n';
    if (callsIn.length) det += 'Called by: ' + callsIn.join(', ');
    if (n.scope) det += (det ? '\n' : '') + 'Scope: ' + n.scope;
    if (n.file) det += (det ? '\n' : '') + 'File: ' + n.file;
    tooltip.querySelector('.tt-detail').textContent = det || n.group;
    tooltip.querySelector('.tt-hint').textContent = 'Click for details \u00B7 Double-click to go to definition';
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(mx + 12, W - 310) + 'px';
    tooltip.style.top = Math.min(my + 12, H - 120) + 'px';
}

function showDetail(n) {
    detail.style.display = 'block';
    detail.querySelector('.dp-kind').textContent = n.kind;
    detail.querySelector('.dp-kind').style.color = n.color;
    detail.querySelector('.dp-name').textContent = n.id;
    detail.querySelector('.dp-scope').textContent =
        (n.scope ? 'in ' + n.scope : '') +
        (n.file ? (n.scope ? ' \u00B7 ' : '') + n.file : '');
    var outSec = document.getElementById('dp-calls-out');
    var callsOut = edges.filter(function(e) { return e.source.id === n.id && e.type === 'call'; });
    if (callsOut.length) {
        outSec.innerHTML = '<div class="dp-section-title">Calls (' + callsOut.length + ')</div>';
        callsOut.forEach(function(e) {
            var a = document.createElement('a'); a.className = 'dp-link';
            a.textContent = '\u2192 ' + e.target.id;
            a.addEventListener('click', function() { focusNode(e.target); });
            outSec.appendChild(a);
        });
    } else { outSec.innerHTML = ''; }
    var inSec = document.getElementById('dp-calls-in');
    var callsIn = edges.filter(function(e) { return e.target.id === n.id && e.type === 'call'; });
    if (callsIn.length) {
        inSec.innerHTML = '<div class="dp-section-title">Called by (' + callsIn.length + ')</div>';
        callsIn.forEach(function(e) {
            var a = document.createElement('a'); a.className = 'dp-link';
            a.textContent = '\u2190 ' + e.source.id;
            a.addEventListener('click', function() { focusNode(e.source); });
            inSec.appendChild(a);
        });
    } else { inSec.innerHTML = ''; }
    var childSec = document.getElementById('dp-children');
    var children = nodes.filter(function(c) { return c.scope === n.id; });
    if (children.length) {
        childSec.innerHTML = '<div class="dp-section-title">Contains (' + children.length + ')</div>';
        children.forEach(function(c) {
            var a = document.createElement('a'); a.className = 'dp-link';
            a.textContent = c.kind + ': ' + c.id;
            a.addEventListener('click', function() { focusNode(c); });
            childSec.appendChild(a);
        });
    } else { childSec.innerHTML = ''; }
    document.getElementById('dp-goto').onclick = function() { vscode.postMessage({ type: 'goto', line: n.line, id: n.id }); };
    var openBtn = document.getElementById('dp-open-file');
    var imp = data.imports.find(function(i) { return i.name === n.id; });
    if (n.kind === 'Import' && imp) {
        openBtn.style.display = 'inline-block'; openBtn.textContent = 'Open File';
        openBtn.onclick = function() { vscode.postMessage({ type: 'openFile', file: imp.file, name: n.id }); };
    } else if (n.file && n.file !== 'main') {
        openBtn.style.display = 'inline-block'; openBtn.textContent = 'Open ' + n.file;
        openBtn.style.background = fileColors[n.file] || '#e94560';
        openBtn.onclick = function() { vscode.postMessage({ type: 'openFile', file: null, name: n.file }); };
    } else { openBtn.style.display = 'none'; }
}

function focusNode(n) { selectedNode = n; showDetail(n); camX = -(n.x - W/2); camY = -(n.y - H/2); camZoom = 1.5; }
detail.querySelector('.dp-close').addEventListener('click', function() { detail.style.display = 'none'; selectedNode = null; });

var simCooldown = 300;
var fileCenters = {};

function simulate() {
    var alpha = Math.max(0.001, simCooldown > 0 ? 0.3 * (simCooldown / 300) : 0.001);
    if (simCooldown > 0) simCooldown--;
    var i, j, a, b, dx, dy, dist, force, fx, fy;
    for (i = 0; i < nodes.length; i++) {
        if (!nodes[i].visible) continue;
        for (j = i + 1; j < nodes.length; j++) {
            if (!nodes[j].visible) continue;
            a = nodes[i]; b = nodes[j];
            dx = b.x - a.x; dy = b.y - a.y;
            dist = Math.sqrt(dx*dx + dy*dy) || 1;
            force = -800 / (dist * dist);
            fx = (dx / dist) * force * alpha; fy = (dy / dist) * force * alpha;
            a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
        }
    }
    edges.forEach(function(e) {
        if (!e.source.visible || !e.target.visible) return;
        var dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
        var dist = Math.sqrt(dx*dx + dy*dy) || 1;
        var idealDist = e.type === 'scope' ? 50 : 100;
        var force = (dist - idealDist) * 0.005 * alpha;
        var fx = (dx / dist) * force, fy = (dy / dist) * force;
        e.source.vx += fx; e.source.vy += fy; e.target.vx -= fx; e.target.vy -= fy;
    });
    nodes.forEach(function(n) {
        if (!n.visible) return;
        n.vx += (W/2 - n.x) * 0.0005 * alpha; n.vy += (H/2 - n.y) * 0.0005 * alpha;
    });
    var groupCenters = {};
    nodes.forEach(function(n) {
        if (!n.visible) return;
        if (!groupCenters[n.group]) groupCenters[n.group] = { x:0, y:0, count:0 };
        groupCenters[n.group].x += n.x; groupCenters[n.group].y += n.y; groupCenters[n.group].count++;
    });
    Object.keys(groupCenters).forEach(function(g) { var gc = groupCenters[g]; gc.x /= gc.count; gc.y /= gc.count; });
    nodes.forEach(function(n) {
        if (!n.visible || !groupCenters[n.group]) return;
        var gc = groupCenters[n.group];
        n.vx += (gc.x - n.x) * 0.003 * alpha; n.vy += (gc.y - n.y) * 0.003 * alpha;
    });
    fileCenters = {};
    nodes.forEach(function(n) {
        if (!n.visible) return;
        if (!fileCenters[n.file]) fileCenters[n.file] = { x:0, y:0, count:0 };
        fileCenters[n.file].x += n.x; fileCenters[n.file].y += n.y; fileCenters[n.file].count++;
    });
    Object.keys(fileCenters).forEach(function(f) { var fc = fileCenters[f]; fc.x /= fc.count; fc.y /= fc.count; });
    nodes.forEach(function(n) {
        if (!n.visible || !fileCenters[n.file]) return;
        var fc = fileCenters[n.file];
        n.vx += (fc.x - n.x) * 0.008 * alpha; n.vy += (fc.y - n.y) * 0.008 * alpha;
    });
    var fileKeys = Object.keys(fileCenters);
    for (i = 0; i < fileKeys.length; i++) {
        for (j = i + 1; j < fileKeys.length; j++) {
            a = fileCenters[fileKeys[i]]; b = fileCenters[fileKeys[j]];
            dx = b.x - a.x; dy = b.y - a.y; dist = Math.sqrt(dx*dx + dy*dy) || 1;
            if (dist < 300) {
                force = -200 / (dist * dist) * alpha;
                fx = (dx / dist) * force; fy = (dy / dist) * force;
                nodes.forEach(function(n) {
                    if (!n.visible) return;
                    if (n.file === fileKeys[i]) { n.vx -= fx * 0.3; n.vy -= fy * 0.3; }
                    if (n.file === fileKeys[j]) { n.vx += fx * 0.3; n.vy += fy * 0.3; }
                });
            }
        }
    }
    nodes.forEach(function(n) {
        if (dragNode === n) return;
        n.vx *= 0.85; n.vy *= 0.85; n.x += n.vx; n.y += n.vy;
    });
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(W/2, H/2); ctx.scale(camZoom, camZoom); ctx.translate(-W/2 + camX, -H/2 + camY);
    if (fileList.length > 1) {
        Object.keys(fileCenters).forEach(function(f) {
            var fc = fileCenters[f];
            if (!fc || fc.count < 2) return;
            var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            nodes.forEach(function(n) {
                if (!n.visible || n.file !== f) return;
                if (n.x < minX) minX = n.x; if (n.y < minY) minY = n.y;
                if (n.x > maxX) maxX = n.x; if (n.y > maxY) maxY = n.y;
            });
            if (minX === Infinity) return;
            var pad = 30, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            var rx = (maxX - minX) / 2 + pad, ry = (maxY - minY) / 2 + pad;
            ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(rx, 40), Math.max(ry, 40), 0, 0, Math.PI * 2);
            ctx.fillStyle = hexAlpha(fileColors[f] || '#666', 0.04); ctx.fill();
            ctx.strokeStyle = hexAlpha(fileColors[f] || '#666', 0.12); ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
            ctx.font = '9px "Segoe UI",system-ui,sans-serif';
            ctx.fillStyle = hexAlpha(fileColors[f] || '#666', 0.5); ctx.textAlign = 'center';
            ctx.fillText(f, cx, minY - pad + 8);
        });
    }
    edges.forEach(function(e) {
        if (!e.source.visible || !e.target.visible) return;
        var hl = selectedNode && (e.source.id === selectedNode.id || e.target.id === selectedNode.id);
        ctx.beginPath(); ctx.moveTo(e.source.x, e.source.y); ctx.lineTo(e.target.x, e.target.y);
        if (e.type === 'scope') {
            ctx.strokeStyle = hl ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.05)'; ctx.setLineDash([3, 4]);
        } else if (e.crossFile) {
            ctx.strokeStyle = hl ? 'rgba(249,115,22,0.8)' : 'rgba(249,115,22,0.15)'; ctx.setLineDash([6, 3]); ctx.lineWidth = hl ? 2.5 : 1;
        } else {
            ctx.strokeStyle = hl ? 'rgba(168,85,247,0.7)' : 'rgba(255,255,255,0.08)'; ctx.setLineDash([]);
        }
        ctx.lineWidth = hl ? 2 : 0.8; ctx.stroke(); ctx.setLineDash([]);
        if (e.type !== 'scope') {
            var dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
            var dist = Math.sqrt(dx*dx + dy*dy) || 1;
            var ux = dx/dist, uy = dy/dist;
            var ax = e.target.x - ux * (e.target.radius + 3), ay = e.target.y - uy * (e.target.radius + 3);
            var sz = hl ? 6 : 4;
            ctx.beginPath(); ctx.moveTo(ax, ay);
            ctx.lineTo(ax - ux*sz - uy*sz*0.5, ay - uy*sz + ux*sz*0.5);
            ctx.lineTo(ax - ux*sz + uy*sz*0.5, ay - uy*sz - ux*sz*0.5);
            ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
        }
    });
    nodes.forEach(function(n) {
        if (!n.visible) return;
        var isSel = selectedNode && selectedNode.id === n.id;
        var isConn = selectedNode && edges.some(function(e) {
            return (e.source.id === selectedNode.id && e.target.id === n.id) || (e.target.id === selectedNode.id && e.source.id === n.id);
        });
        var isHov = hoveredNode && hoveredNode.id === n.id;
        var dimmed = selectedNode && !isSel && !isConn;
        var al = dimmed ? 0.2 : 1;
        if (isSel || isHov) { ctx.beginPath(); ctx.arc(n.x, n.y, n.radius + 8, 0, Math.PI * 2); ctx.fillStyle = n.color + '22'; ctx.fill(); }
        ctx.beginPath(); ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2); ctx.fillStyle = hexAlpha(n.color, al); ctx.fill();
        if (isSel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
        var fs = n.radius > 10 ? 11 : 9;
        ctx.font = (isSel ? 'bold ' : '') + fs + 'px "Segoe UI",system-ui,sans-serif';
        ctx.fillStyle = hexAlpha('#d4d4d4', dimmed ? 0.3 : 0.9); ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x, n.y + n.radius + fs + 3);
    });
    ctx.restore();
    var vis = nodes.filter(function(n) { return n.visible; }).length;
    var visEdges = edges.filter(function(e) { return e.source.visible && e.target.visible; }).length;
    var visFilesSet = {};
    nodes.forEach(function(n) { if (n.visible) visFilesSet[n.file] = true; });
    var visFiles = Object.keys(visFilesSet).length;
    var crossEdges = edges.filter(function(e) { return e.crossFile && e.source.visible && e.target.visible; }).length;
    statsEl.textContent = vis + '/' + nodes.length + ' nodes \u00B7 ' + visEdges + ' edges \u00B7 ' + visFiles + ' files \u00B7 ' + crossEdges + ' cross-file';
}

function hexAlpha(hex, a) {
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function loop() {
    if (simCooldown > 0 || dragNode) simulate();
    draw();
    requestAnimationFrame(loop);
}
loop();

canvas.addEventListener('mousedown', function() { simCooldown = Math.max(simCooldown, 60); });
searchInput.addEventListener('input', function() { simCooldown = Math.max(simCooldown, 120); });
})();
</script>
</body>
</html>
